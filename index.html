<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NepHR - Smart HR Management System</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#508C7F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NepHR">
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-bg: #508C7F;
            --primary-dark: #3a5e54;
            --text-white: #ffffff;
        }

        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--primary-bg); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            touch-action: manipulation;
        }

        /* Initial App Frame Loader */
        #frame-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--primary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #frame-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Iframe Application */
        #appFrame { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            background: transparent;
        }

        /* Khatra Animated Offline UI */
        #offline-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-white);
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle, #508C7F 0%, #355d54 100%);
            z-index: 20;
            position: absolute;
            top: 0; left: 0; width: 100%;
        }

        .icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .wifi-base {
            font-size: 70px;
            z-index: 5;
            position: relative;
            animation: bounce 2s infinite ease-in-out;
        }

        .wave {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: ripple 2s infinite linear;
            opacity: 0;
        }

        .wave:nth-child(2) { animation-delay: 0.5s; }
        .wave:nth-child(3) { animation-delay: 1s; }

        @keyframes ripple {
            0% { width: 70px; height: 70px; opacity: 0.8; }
            100% { width: 200px; height: 220px; opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { font-size: 26px; margin: 10px 0; font-weight: 700; }
        p { font-size: 15px; opacity: 0.85; max-width: 320px; line-height: 1.5; margin-bottom: 25px; }

        .retry-btn {
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            background: white;
            color: var(--primary-bg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .retry-btn:active { transform: scale(0.95); }

        .footer-tag {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            opacity: 0.6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Initial Loading Screen before Iframe boots -->
    <div id="frame-loader">
        <div class="spinner"></div>
        <div style="font-weight:600; font-size:15px; letter-spacing:0.5px;">Loading NepHR...</div>
    </div>

    <!-- Main Application Iframe -->
    <!-- ⚠️ ध्यान दिनुहोस्: src="..." भित्र तपाईंको नतिजा प्राप्त भएको नयाँ GAS /exec URL हाल्नुहोस् -->
    <iframe 
        id="appFrame" 
        src="https://script.google.com/macros/s/AKfycbzUnc_m3fGpa3dNCnnsPV2BBHYO0i8-J8WUwoZPIhltnbon1gAKUgxsZaZuteDEDYwU/exec" 
        allow="geolocation; camera; microphone; display-capture">
    </iframe>

    <!-- Offline Connection Screen -->
    <div id="offline-screen">
        <div class="icon-wrapper">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <i class="fas fa-wifi wifi-base"></i>
        </div>

        <h1>Offline Connection</h1>
        <p>No internet connection found. Please check your Mobile Data or WiFi to access NepHR.</p>
        
        <button class="retry-btn" onclick="retryConnection()">
            <i class="fas fa-sync-alt" id="retry-icon"></i>
            <span id="btn-text">Retry Connection</span>
        </button>

        <div class="footer-tag">Connectivity Status: Disconnected</div>
    </div>

    <script>
        const frame = document.getElementById('appFrame');
        const frameLoader = document.getElementById('frame-loader');
        const offlineScreen = document.getElementById('offline-screen');
        const btnText = document.getElementById('btn-text');
        const retryIcon = document.getElementById('retry-icon');

        // Hide frame loader once iframe completes loading
        frame.addEventListener('load', () => {
            if (frameLoader) frameLoader.classList.add('hidden');
        });

        // Timeout fallback to hide loader if load event takes too long
        setTimeout(() => {
            if (frameLoader) frameLoader.classList.add('hidden');
        }, 5000);

        function checkStatus() {
            if (navigator.onLine) {
                frame.style.display = "block";
                offlineScreen.style.display = "none";
            } else {
                frame.style.display = "none";
                offlineScreen.style.display = "flex";
            }
        }

        function retryConnection() {
            btnText.innerText = "Checking...";
            if (retryIcon) retryIcon.classList.add('fa-spin');
            
            setTimeout(() => {
                if (navigator.onLine) {
                    location.reload(); 
                } else {
                    if (retryIcon) retryIcon.classList.remove('fa-spin');
                    btnText.innerText = "Retry Connection";
                }
            }, 1200);
        }

        window.addEventListener('online', checkStatus);
        window.addEventListener('offline', checkStatus);
        window.onload = checkStatus;

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js?v=4')
                    .then(reg => console.log('[PWA] Service Worker Registered'))
                    .catch(err => console.warn('[PWA] Service Worker Failed:', err)); 
            });
        }

        // 🟢 SMART PWA AUTO-UPDATE DETECTOR
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('sw.js?v=4').then(reg => {
                console.log('[PWA] Service Worker Active');

                // १. ब्याकग्राउन्डमा नयाँ अपडेट चेक गर्ने
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    if (installingWorker == null) return;
                    
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed') {
                            if (navigator.serviceWorker.controller) {
                                console.log('[PWA] New update found! Auto-reloading app...');
                                // नयाँ अपडेट आएपछि आफैं १ सेकेन्डमा रिफ्रेस हुने
                                window.location.reload();
                            }
                        }
                    };
                };
            }).catch(err => console.warn('[PWA] SW Reg Error:', err)); 
        });

        // २. जब नयाँ वर्करले नियन्त्रण लिन्छ, स्वतः रिफ्रेस गर्ने
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                refreshing = true;
                console.log('[PWA] Controller changed. Reloading page...');
                window.location.reload();
            }
        });

        // ३. मोबाइलमा एप खोल्नासाथ (App Resume/Foreground हुँदा) नयाँ अपडेट जाँच गर्ने (iOS & Android)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
                navigator.serviceWorker.ready.then(reg => reg.update());
            }
        });
    }
    </script>
</body>
</html>
